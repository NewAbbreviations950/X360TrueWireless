[package]
name = "x360truewireless-daemon"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ctrlc = { version = "3.5.2", features = ["termination"] }
nusb = "0.2.7"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
x360truewireless-common = { version = "0.2.0", path = "../common" }
x360truewireless-proto = { version = "0.2.0", path = "../proto" }
zbus = "5.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
libc = "0.2.190"
xkbcommon-dl = "0.4.2"

[target.'cfg(windows)'.dependencies]
# Windows has no session bus: the settings app connects peer to peer.
zbus = { version = "5.19.0", features = ["p2p"] }
libloading = "0.9.0"
uds_windows = "1.2.1"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
