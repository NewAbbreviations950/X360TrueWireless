[package]
name = "x360truewireless-tray"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
resvg = { version = "0.48.1", default-features = false }
x360truewireless-common = { version = "0.2.0", path = "../common" }
zbus = "5.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
tray-icon = { version = "0.26.1", default-features = false }
uds_windows = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows has no session bus: the app connects to the driver peer to peer.
zbus = { version = "5.19.0", features = ["p2p"] }
